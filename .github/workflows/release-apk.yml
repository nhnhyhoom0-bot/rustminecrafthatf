name: Build & Publish RustCraft APK to Releases

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag name (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Android APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Restore debug keystore & prepare release keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > my-upload-key.jks
          else
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -alias upload \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "${{ secrets.STORE_PASSWORD || 'rustcraft_release_pass' }}" \
              -keypass "${{ secrets.KEY_PASSWORD || 'rustcraft_release_pass' }}" \
              -dname "CN=RustCraft, OU=Mobile, O=RustCraft, L=Unknown, S=Unknown, C=US"
          fi

      - name: Build Release APK
        env:
          KEYSTORE_PATH: "${{ github.workspace }}/my-upload-key.jks"
          STORE_PASSWORD: "${{ secrets.STORE_PASSWORD || 'rustcraft_release_pass' }}"
          KEY_PASSWORD: "${{ secrets.KEY_PASSWORD || 'rustcraft_release_pass' }}"
          CURSEFORGE_API_KEY: "${{ secrets.CURSEFORGE_API_KEY }}"
          MICROSOFT_CLIENT_ID: "${{ secrets.MICROSOFT_CLIENT_ID }}"
        run: |
          gradle :app:assembleRelease --no-daemon

      - name: Package APK asset
        run: |
          if [ -n "${{ github.event.inputs.release_tag }}" ]; then
            TAG="${{ github.event.inputs.release_tag }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v1.0.0"
          fi
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          mkdir -p release-assets
          cp app/build/outputs/apk/release/app-release.apk "release-assets/RustCraft-${TAG}.apk"

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "RustCraft ${{ env.RELEASE_TAG }}"
          body: |
            إصدار تلقائي لتطبيق **RustCraft Launcher** (APK).
            - يدعم البحث عن النسخ الجاهزة من Zalith / Mojo / Pojav
            - يدعم السكنات وإظهارها في السيرفرات وحسابات كراك ومايكروسوفت
            - يدعم مودات Modrinth و CurseForge ومحرر التحكم باللمس
          files: |
            release-assets/RustCraft-*.apk
          draft: false
          prerelease: false
